<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#1c1a17"><title>Mochi 字卡</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>html,body{margin:0;padding:0;width:100%;height:100%;background:#1c1a17}#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#9a8f80;font:14px/1.6 system-ui,-apple-system,sans-serif;letter-spacing:.2em}</style></head><body><div id="ld">加 载 中 …</div><script>if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}(async function(){var base='';try{base=new URL('.',location.href).href}catch(e){}var parts=[],i=0;for(;;){var n=(i<10?'0':'')+i;var r;try{r=await fetch(base+'parts/mochi-'+n+'.part?t='+Date.now(),{cache:'no-store'})}catch(e){break}if(!r.ok)break;parts.push(await r.text());i++}if(!parts.length){document.getElementById('ld').textContent='加载失败，请检查网络后刷新重试';return}var html=parts.join('');document.open();document.write(html);document.close()})();</script></body></html>
