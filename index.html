<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#1c1a17"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><title>齊陳家</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>html,body{margin:0;padding:0;width:100%;height:100%;background:#1c1a17}#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#9a8f80;font:14px/1.6 system-ui,-apple-system,sans-serif;letter-spacing:.2em}#bar{width:56%;max-width:260px;height:3px;border-radius:3px;background:#2e2a25;overflow:hidden}#fill{height:100%;width:0;background:#9a8f80;transition:width .2s}</style></head><body><div id="ld"><div id="txt">加 载 中 …</div><div id="bar"><div id="fill"></div></div></div><script>if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}(function(){
/* v932：修复 v931 致命 bug——Uint8Array 数组不能用 join('') 拼文本（会得到数字串），
   改用 TextDecoder 流式解码（正确处理跨块 UTF-8 汉字）；并把 8MB 一次性
   document.write 改成同步分批写入，降低手机浏览器内存峰值。
   三通道：本站 → jsDelivr → statically；15 秒无数据自动换线 */
var V='v931';
var sources=[
  function(p){ return new URL('.',location.href).href+'parts/'+V+'/'+p; },
  function(p){ return 'https://cdn.jsdelivr.net/gh/13471143665/mochi@main/parts/'+V+'/'+p; },
  function(p){ return 'https://cdn.statically.io/gh/13471143665/mochi/main/parts/'+V+'/'+p; }
];
var txt=document.getElementById('txt'),fill=document.getElementById('fill');
function setT(s){ try{ txt.textContent=s; }catch(e){} }
var TOTAL=3145728*2+1717634, loaded=0;
function show(cur,got,len){
  var pct=Math.min(99,Math.round((loaded+got)/TOTAL*100));
  setT('加 载 中 '+pct+'%');
  try{ fill.style.width=pct+'%'; }catch(e){}
}
function fetchPart(p,label){
  var order=sources.slice();
  function attempt(){
    if(!order.length) return Promise.reject(new Error('all channels failed'));
    var url=order.shift()(p);
    var ctrl=('AbortController' in window)?new AbortController():null;
    var stall=null,dead=false;
    function reset(){
      if(stall)clearTimeout(stall);
      stall=setTimeout(function(){ dead=true; try{ctrl&&ctrl.abort();}catch(e){} },15000);
    }
    reset();
    return fetch(url,{cache:'no-store',signal:ctrl?ctrl.signal:undefined}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      var len=+r.headers.get('Content-Length')||0;
      var rd=r.body&&r.body.getReader?r.body.getReader():null;
      if(!rd){ return r.text().then(function(t){ clearTimeout(stall); show(label,t.length,len); return t; }); }
      var dec=new TextDecoder('utf-8'),out='',got=0;
      function pump(){
        return rd.read().then(function(x){
          if(dead) throw new Error('stalled');
          reset();
          if(x.done){ clearTimeout(stall); out+=dec.decode(); return out; }
          out+=dec.decode(x.value,{stream:true});
          got+=x.value.length; show(label,got,len);
          return pump();
        });
      }
      return pump();
    }).catch(function(e){ clearTimeout(stall); return attempt(); });
  }
  return attempt();
}
var parts=[],i=0;
function next(){
  if(i>=3) return Promise.resolve();
  var n=(i<10?'0':'')+i;
  return fetchPart('mochi-'+n+'.part',i).then(function(t){
    parts.push(t); loaded+=t.length; i++;
    return next();
  });
}
next().then(function(){
  if(!parts.length){ setT('加载失败，请检查网络后刷新重试'); return; }
  setT('即 将 进 入 …');
  /* v932b：不再 parts.join('') 生成又一份 8MB 字符串（手机 Edge 内存吃紧会删内容），
     逐块顺序写入同一个解析流，效果等价但峰值内存减半 */
  var CH=262144;
  document.open();
  for(var j=0;j<parts.length;j++){
    var seg=parts[j];
    for(var k=0;k<seg.length;k+=CH) document.write(seg.slice(k,k+CH));
  }
  document.close();
}).catch(function(){
  setT('加载失败 · 请刷新重试（可切换 Wi-Fi / 流量再试）');
});
})();</script></body></html>
